# Mikha-Ref v0.1 dev topology.
#
# One process, one camera. `docker compose up` builds the image, starts
# Uvicorn on :8000, and exposes the HTMX dashboard at
# http://localhost:8000/ . SQLite event log persists in ./data/.
#
# Live camera integration (poller loop feeding /api/submit) is the next
# operational step — the M5 dashboard proves the plumbing without
# requiring a live 511 feed. Add a `poller` service downstream.

services:
  api:
    build: .
    image: mikha-511:dev
    container_name: mikha-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - MIKHA_STORE=/data/events.sqlite
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\").status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
